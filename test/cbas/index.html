<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>cbas-ui behaviour tests</title>

    <!--
      The same loader the product uses. es-module-shims-options.js carries the
      fetch hook that turns an `import ... from "./x.html"` into a module
      exporting the template text, which is how every dialog template in this
      UI is loaded; without it the controller module cannot even be imported.
      The importmap is the product's own, so "angular", "lodash",
      "components/mn_pools" and the rest resolve to exactly what ships.
    -->
    <script src="/ui/libs/es-module-shims-options.js"></script>
    <script async src="/ui/libs/es-module-shims.js"></script>
    <script type="importmap-shim" src="/harness/importmap.json"></script>
    <script type="module-shim" src="/harness/run.js"></script>
  </head>
  <body></body>
</html>
